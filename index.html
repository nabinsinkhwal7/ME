<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nabin Sinkhwal - Passionate developer and writer. Explore my projects, skills, and thoughts on technology.">
    <meta name="keywords" content="Nabin Sinkhwal, developer, programmer, web development, software engineer, writer">
    <meta name="author" content="Nabin Sinkhwal">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nabinsinkhwal.com.np/">
    <meta property="og:title" content="Nabin Sinkhwal - Developer & Writer">
    <meta property="og:description" content="Passionate developer and writer. Explore my projects, skills, and thoughts on technology.">
    <meta property="og:image" content="https://nabinsinkhwal.com.np/og-image.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://nabinsinkhwal.com.np/">
    <meta property="twitter:title" content="Nabin Sinkhwal - Developer & Writer">
    <meta property="twitter:description" content="Passionate developer and writer. Explore my projects, skills, and thoughts on technology.">
    <meta property="twitter:image" content="https://nabinsinkhwal.com.np/og-image.jpg">
    
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Nabin Sinkhwal - Developer & Writer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="glow-line"></div>
    <h1 class="title">Nabin Sinkhwal</h1>
    <p class="subtitle">Welcome to my personal website!</p>
    <div class="glow-line"></div>
    <canvas class="particles"></canvas>

    <!-- Games Section -->
    <div class="games-section">
        <h2 class="games-title">🎮 Play Some Games</h2>
        <div class="games-grid">
            <div class="game-card" onclick="openGame('tictactoe')">
                <div class="game-icon">⭕</div>
                <h3>Tic-Tac-Toe</h3>
                <p>Classic 3x3 strategy game</p>
            </div>
            <div class="game-card" onclick="openGame('chess')">
                <div class="game-icon">♟️</div>
                <h3>Chess Puzzles</h3>
                <p>Checkmate in few moves</p>
            </div>
            <div class="game-card" onclick="openGame('memory')">
                <div class="game-icon">🧠</div>
                <h3>Memory Game</h3>
                <p>Test your memory skills</p>
            </div>
        </div>
    </div>

    <!-- Game Modal -->
    <div id="gameModal" class="game-modal">
        <div class="game-modal-content">
            <span class="close-game" onclick="closeGame()">&times;</span>
            <div id="gameContainer">
                <!-- Game content will be loaded here -->
            </div>
        </div>
    </div>

    
    <script src="script.js"></script>
</body>
</html>
